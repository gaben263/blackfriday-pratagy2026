/* =========================================================
   DESIGN TOKENS
   ========================================================= */
:root {
  --bf-black: #0A0A0A;
  --bf-orange: #FF4500;
  --bf-orange-deep: #D8340A;
  --bf-gold: #FFD700;
  --bf-gold-deep: #E89B00;
  --bf-white: #FFFFFF;
  --bf-muted: rgba(255, 255, 255, .72);
  --bf-font: 'Fibra One', 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
  --bf-ease-out: cubic-bezier(.22, 1, .36, 1);
  --bf-spring: cubic-bezier(.34, 1.56, .64, 1);
  --bf-gutter: clamp(16px, 5vw, 48px);
  --bf-seal: min(80vw, 62vh, 580px);
  --bf-seal: min(80vw, 62svh, 580px);
  --bf-hero-h: 260vh;
}

/* =========================================================
   BASE
   ========================================================= */
/* Só o que precisa ser da página inteira fica em html/body: fundo preto (sem bordas brancas no
   "puxar para atualizar" do celular), margem zero e rolagem suave dos links #. O resto vive em .bf. */
:where(.bf, .bf-watermark, .bf-cursor-glow), :where(.bf, .bf-watermark) *, :where(.bf) *::before, :where(.bf) *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; background: var(--bf-black); }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body { margin: 0; background: var(--bf-black); }
.bf {
  position: relative; z-index: 1; overflow-x: clip;
  color: var(--bf-white); font-family: var(--bf-font); font-weight: 400; line-height: 1.5;
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
}
:where(.bf) img { display: block; max-width: 100%; height: auto; }

/* Blindagem contra o CSS da plataforma (SharpSpring Pages: tema Foundry + Bootstrap), que estiliza as tags
   direto: section/footer com padding 70px e overflow hidden (quebra o sticky do hero), títulos cinza #292929
   em Open Sans 300, margem de 24px em button, transição em todo link, cor azul em a:hover/a:focus.
   :where(.bf) + tag empata com as regras do tema e vence por vir depois; as classes da página continuam
   mandando. Aqui só se devolve o padrão do navegador. */
:where(.bf) section, :where(.bf) footer { padding: 0; overflow: visible; }
:where(.bf) :is(h1, h2, h3) { margin: 0; color: inherit; font-family: inherit; font-size: inherit; font-weight: 700; line-height: inherit; }
:where(.bf) p { color: inherit; font-family: inherit; font-size: inherit; line-height: inherit; }
:where(.bf) button { margin: 0; font: inherit; }
:where(.bf) a { font-weight: inherit; transition: none; }
.bf a:is(:link, :visited, :hover, :focus, :active) { text-decoration: none; }
/* a:hover/a:focus do tema (0,1,1) passam por cima da cor de .bf-btn (0,1,0): a cor de cada link é repetida nos estados */
.bf-hero__hint:is(:hover, :focus, :active, :visited) { color: #fff; }
.bf-btn:is(:hover, :focus, :active, :visited) { color: var(--bf-gold); }
.bf-btn--gold:is(:hover, :focus, :active, :visited) { color: #7A1A00; }
.bf-btn--b2b:is(:hover, :focus, :active, :visited) { color: var(--bf-white); }
.bf-wrap { width: min(1180px, 100% - var(--bf-gutter) * 2); margin-inline: auto; }
.bf-sr { position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; border: 0; }
.bf :focus-visible { outline: 3px solid var(--bf-gold); outline-offset: 4px; }
.bf [hidden] { display: none !important; }

/* Selo gigante fixo no fundo (5%) — parallax via JS */
.bf-watermark { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bf-watermark img {
  position: absolute; left: 50%; top: 50%;
  width: max(125vmin, 720px); max-width: none; height: auto;
  opacity: .05; transform: translate3d(-50%, -50%, 0); will-change: transform;
}

/* =========================================================
   1. HERO (pin + bolha/eclipse)
   ========================================================= */
.bf-hero { position: relative; height: var(--bf-hero-h); }
.bf-hero__pin { position: sticky; top: 0; height: 100vh; overflow: hidden; isolation: isolate; }
.bf-hero__backdrop {
  position: absolute; inset: 0; will-change: opacity;
  background: linear-gradient(180deg, #0B7FE0 0%, #37A9F5 55%, #BFE6FF 100%);
}
.bf-hero__photo {
  position: absolute; inset: 0; width: 100%; height: 100%; max-width: none;
  object-fit: cover; object-position: 50% 52%;
  transform-origin: 50% 62%; will-change: transform;
}
.bf-js .bf-hero__photo { opacity: 0; transition: opacity .9s ease; }
.bf-js .bf-hero__photo.is-loaded { opacity: 1; }
.bf-hero__shade {
  position: absolute; inset: 0;
  background:
    radial-gradient(120% 90% at 50% 42%, rgba(0,0,0,0) 55%, rgba(0,0,0,.32) 100%),
    linear-gradient(180deg, rgba(10,10,10,.22) 0%, rgba(10,10,10,0) 20%, rgba(10,10,10,0) 68%, rgba(10,10,10,.5) 100%);
}
/* Bolha preta: clip-path circle() controlado pelo scroll */
.bf-bubble { position: absolute; inset: 0; background: var(--bf-black); clip-path: circle(0px at 50% 150%); }
/* Coroa de luz (eclipse) que acompanha a borda da bolha */
.bf-bubble-glow {
  position: absolute; left: 0; top: 0; width: 400px; height: 400px; border-radius: 50%;
  background: radial-gradient(closest-side,
    rgba(255,215,0,0) 75%, rgba(255,236,140,1) 79%, rgba(255,150,20,.8) 82.5%,
    rgba(255,69,0,.32) 89%, rgba(255,69,0,0) 100%);
  opacity: 0; will-change: transform, opacity; pointer-events: none;
}
.bf-hero__stage {
  position: absolute; left: 0; right: 0; top: 0; height: 100vh; height: 100svh;
  display: grid; place-items: center; pointer-events: none;
}
.bf-hero__anchor { position: relative; top: 6vh; top: 6svh; width: var(--bf-seal); aspect-ratio: 604 / 596; }
/* Retroiluminação laranja do selo: destaca o arco contra o fundo preto */
.bf-hero__halo {
  position: absolute; inset: -22%; z-index: 1; border-radius: 50%; opacity: 0;
  background: radial-gradient(closest-side,
    rgba(255,140,40,.6) 0%, rgba(255,110,25,.55) 50%, rgba(255,80,10,.45) 62%,
    rgba(255,69,0,.18) 74%, rgba(255,69,0,0) 88%);
  animation: bf-breathe 4.5s ease-in-out infinite;
}
.bf-hero__seal { position: absolute; inset: 0; z-index: 3; margin: 0; perspective: 900px; will-change: transform; }
.bf-hero__seal img { width: 100%; }
.bf-par { will-change: transform; }

.bf-js .bf-pop { opacity: 0; transform: scale(.55) rotate(-8deg); }
.bf-ready .bf-pop { animation: bf-pop 1.2s var(--bf-spring) both; }
.bf-float { animation: bf-float 6s ease-in-out infinite; }
.bf-float--b { animation-duration: 7.5s; animation-direction: reverse; }

.bf-hero__hint {
  position: absolute; left: 50%; bottom: max(26px, env(safe-area-inset-bottom)); z-index: 5;
  transform: translateX(-50%); pointer-events: auto;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
  color: #fff; text-decoration: none; font-weight: 700; font-size: 12px;
  letter-spacing: .28em; text-transform: uppercase; white-space: nowrap;
  text-shadow: 0 2px 12px rgba(0,0,0,.55);
}
.bf-mouse { position: relative; width: 24px; height: 38px; border: 2px solid rgba(255,255,255,.92); border-radius: 14px; box-shadow: 0 2px 12px rgba(0,0,0,.3); }
.bf-mouse::after {
  content: ''; position: absolute; left: 50%; top: 7px; width: 4px; height: 8px; margin-left: -2px;
  border-radius: 2px; background: var(--bf-gold); animation: bf-wheel 1.6s ease-in-out infinite;
}

@keyframes bf-pop { from { opacity: 0; transform: scale(.55) rotate(-8deg); } to { opacity: 1; transform: none; } }
@keyframes bf-float { 0%, 100% { transform: translate3d(0, 0, 0) rotate(0); } 50% { transform: translate3d(0, -10px, 0) rotate(-1.2deg); } }
@keyframes bf-breathe { 0%, 100% { transform: scale(.94); } 50% { transform: scale(1.05); } }
@keyframes bf-wheel { 0% { transform: translateY(0); opacity: 1; } 70% { transform: translateY(12px); opacity: 0; } 100% { opacity: 0; } }

/* Ícones de % nas laterais da página (parallax no scroll).
   Começam com opacity 0 e surgem quando a bolha termina de cobrir a tela (.is-on via JS).
   Ficam acima do hero e abaixo do conteúdo das seções, para não atrapalhar a leitura.
   bottom: 0 dá a altura inicial; depois o JS trava essa altura em px (ver measure), para que conteúdo
   carregado depois (ex.: o formulário da SharpSpring) não reposicione os ícones. O topo de cada ícone usa
   a mesma régua travada (--pct-u = 1% dela), então eles também não se mexem quando a página encolhe
   (ex.: plano B do formulário no celular). */
.bf-pcts {
  --pct-o: 1; --pct-k: 1.4; --pct-u: 1%;
  position: absolute; left: 0; right: 0; top: calc(var(--bf-hero-h) - 100vh); bottom: 0; z-index: 0;
  overflow: hidden; pointer-events: none;
}
/* Por ícone: --t topo (% da página) · --s tamanho base (px) · --x recuo da lateral (vw) ·
   --xs recuo em frações do próprio ícone (negativo = parcialmente fora da tela) · --r rotação ·
   --o opacidade da camada (perto/meio/longe) · --m atenuação automática (JS) quando o ícone
   fica atrás da coluna de conteúdo, para nunca atrapalhar a leitura */
.bf-pct {
  position: absolute; top: calc(var(--t) * var(--pct-u)); width: calc(var(--s) * var(--pct-k) * 1px);
  opacity: 0; transform: rotate(calc(var(--r) * 1deg)); will-change: transform, opacity;
  transition: opacity .9s var(--bf-ease-out);
}
.bf-pct--l { left: calc(var(--x, 0) * 1vw + var(--xs, 0) * var(--s) * var(--pct-k) * 1px); }
.bf-pct--r { right: calc(var(--x, 0) * 1vw + var(--xs, 0) * var(--s) * var(--pct-k) * 1px); }
.bf-pct img { width: 100%; scale: .6; transition: scale 1.1s var(--bf-spring); }
.bf-pct--far img { filter: blur(1.2px); }
.bf-pcts:not(.is-on) .bf-pct img { animation-play-state: paused; }
.bf-pcts.is-on .bf-pct { opacity: calc(var(--o, .8) * var(--pct-o) * var(--m, 1)); transition-delay: calc(var(--i) * 70ms); }
.bf-pcts.is-on .bf-pct img { scale: 1; transition-delay: calc(var(--i) * 70ms); }
@media (max-width: 1199px) { .bf-pcts { --pct-o: .9; --pct-k: 1.1; } }
@media (max-width: 768px) {
  .bf-pcts { --pct-o: .8; --pct-k: .75; }
  .bf-pct--far img { filter: none; }
}

/* =========================================================
   TIPOGRAFIA COMPARTILHADA
   ========================================================= */
.bf-eyebrow {
  display: inline-flex; align-items: center; gap: 14px; margin: 0 0 22px;
  color: var(--bf-gold); font-weight: 700; font-size: clamp(12px, 1.1vw, 15px);
  letter-spacing: .32em; text-transform: uppercase;
}
.bf-eyebrow::before, .bf-eyebrow::after { content: ''; width: 34px; height: 2px; background: linear-gradient(90deg, rgba(255,69,0,0), var(--bf-orange)); }
.bf-eyebrow::after { transform: scaleX(-1); }
/* Títulos equilibrados: linhas de tamanho parecido, sem uma palavra sozinha na última.
   "pretty" vem antes como reserva; onde "balance" é suportado, ele vence. */
.bf-h2, .bf-intro__title { text-wrap: pretty; text-wrap: balance; }
.bf-h2 { margin: 0 0 .35em; font-weight: 900; font-size: clamp(32px, 4.6vw, 64px); line-height: 1; text-transform: uppercase; }

/* Palavras animadas pelo scroll (JS divide o texto e controla --p) */
.bf-w { display: inline-block; opacity: var(--o, 1); transform: translate3d(0, calc((1 - var(--o, 1)) * .6em), 0); }
.bf-split .bf-w { --o: clamp(0, (var(--p, 0) * (var(--n, 1) + 5) - var(--i, 0)) / 5, 1); }

/* Revelação única (IntersectionObserver) */
.bf-js .bf-reveal { opacity: 0; transform: translate3d(0, 40px, 0); transition: opacity .9s var(--bf-ease-out), transform 1.1s var(--bf-ease-out); }
.bf-js .bf-reveal.is-in { opacity: 1; transform: none; }

/* =========================================================
   3. TEXTO + BOTÃO STICKY
   ========================================================= */
.bf-intro { position: relative; padding: clamp(32px, 6vh, 72px) 0 clamp(56px, 10vh, 120px); text-align: center; }
.bf-intro__title {
  margin: 0 auto .55em; max-width: 15ch;
  font-weight: 900; font-size: clamp(38px, 6.4vw, 92px); line-height: .98; letter-spacing: -.01em; text-transform: uppercase;
}
.bf-intro__title em {
  font-style: normal; color: var(--bf-orange);
  background: linear-gradient(92deg, var(--bf-orange) 10%, var(--bf-gold) 90%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
/* Justificado com a última linha centralizada, sem hifenização (como na obrigado.html). As palavras
   do data-split são inline-block com o espaço fora delas, então o justificado distribui o espaço entre elas. */
.bf-intro__text {
  margin: 0 auto 1.2em; max-width: 46ch; color: var(--bf-muted); font-size: clamp(17px, 1.6vw, 22px); line-height: 1.6;
  text-align: justify; text-align-last: center; -webkit-hyphens: none; hyphens: none; text-wrap: pretty;   /* sem viúvas */
}
/* Celular: centralizado, sem justificar — em coluna estreita o justificado abre espaços grandes entre as palavras */
@media (max-width: 479px) { .bf-intro__text { text-align: center; text-align-last: auto; } }

/* Contagem regressiva */
.bf-countdown { position: relative; padding: 0 0 clamp(24px, 5vh, 64px); text-align: center; }
.bf-cd__title {
  margin: 0 0 clamp(18px, 3vh, 30px); color: var(--bf-white); opacity: .85;
  font-weight: 600; font-size: clamp(13px, 1.3vw, 16px); letter-spacing: .32em; text-transform: uppercase;
}
.bf-cd__grid { display: flex; justify-content: center; align-items: flex-start; gap: clamp(8px, 2vw, 28px); }
.bf-cd__unit { display: flex; flex-direction: column; align-items: center; min-width: clamp(72px, 11vw, 132px); }
/* Tamanhos em px, não rem: a plataforma muda a base do rem (html { font-size: 62.5% } = 10px) */
.bf-cd__num, .bf-cd__sep { font-size: clamp(40px, 6vw, 72px); line-height: 1; font-weight: 700; }
.bf-cd__num { display: inline-flex; color: var(--bf-gold); font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
/* A Fibra One não traz algarismos tabulares (o "1" é bem mais estreito que o "0"): cada dígito ganha
   uma casa fixa da largura do mais largo, para os números não "pularem" quando mudam */
.bf-cd__num > span { display: inline-block; width: .77em; text-align: center; }
.bf-cd__sep { color: rgba(255, 215, 0, .4); }
.bf-cd__label {
  margin-top: clamp(8px, 1.2vw, 14px); color: var(--bf-white); opacity: .85;
  font-weight: 400; font-size: clamp(11.2px, 1.5vw, 14.4px); letter-spacing: 2px; text-transform: uppercase;
}
.bf-cd__done { margin: 0; color: var(--bf-gold); font-weight: 900; font-size: clamp(30px, 5.4vw, 64px); line-height: 1.05; text-transform: uppercase; }
.bf-cd.is-done .bf-cd__title, .bf-cd.is-done .bf-cd__grid { display: none; }
@media (max-width: 480px) {
  .bf-cd__grid { gap: 4px; }
  .bf-cd__unit { min-width: 0; flex: 1 1 0; }
  .bf-cd__num, .bf-cd__sep { font-size: clamp(30.4px, 10vw, 40px); }
  .bf-cd__label { font-size: 9.92px; letter-spacing: 1px; }
}

/* Botão — recriação em CSS do Assets/botao-entre-para-o-grupo.webp */
.bf-btn {
  position: relative; isolation: isolate; overflow: hidden;
  display: inline-flex; align-items: center; justify-content: center; gap: .6em;
  min-height: 64px; padding: 0 clamp(26px, 3.2vw, 46px);
  border: 3px solid transparent; border-radius: 14px;
  background:
    radial-gradient(120% 140% at 50% 0%, #FF6A2E 0%, var(--bf-orange) 42%, var(--bf-orange-deep) 100%) padding-box,
    linear-gradient(180deg, #FFE45C 0%, var(--bf-gold) 38%, var(--bf-gold-deep) 100%) border-box;
  color: var(--bf-gold); font: 900 clamp(17px, 1.7vw, 23px)/1 var(--bf-font);
  letter-spacing: .02em; text-transform: uppercase; text-decoration: none; white-space: nowrap;
  text-shadow: 0 2px 0 rgba(122, 26, 0, .45);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.28), inset 0 -5px 12px rgba(120,20,0,.35), 0 12px 24px rgba(0,0,0,.45);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: transform .25s var(--bf-ease-out), box-shadow .25s ease, filter .25s ease;
}
.bf-btn::after {
  content: ''; position: absolute; z-index: -1; top: -30%; bottom: -30%; left: -10%; width: 26%;
  background: linear-gradient(100deg, rgba(255,255,255,0), rgba(255,255,255,.5), rgba(255,255,255,0));
  transform: translateX(-160%) skewX(-18deg); pointer-events: none;
}
.bf-btn:hover {
  transform: translateY(-2px); filter: saturate(1.1);
  box-shadow: inset 0 2px 0 rgba(255,255,255,.32), inset 0 -5px 12px rgba(120,20,0,.35), 0 16px 30px rgba(0,0,0,.5), 0 0 28px rgba(255,69,0,.55);
}
.bf-btn:hover::after { transform: translateX(520%) skewX(-18deg); transition: transform .85s var(--bf-ease-out); }
.bf-btn:active { transform: translateY(1px); }
.bf-btn--cta::after { animation: bf-shine 4.2s ease-in-out infinite; }
.bf-btn--gold {
  color: #7A1A00; text-shadow: 0 1px 0 rgba(255,255,255,.35);
  background:
    linear-gradient(180deg, #FFEF7A 0%, var(--bf-gold) 45%, #F2A900 100%) padding-box,
    linear-gradient(180deg, #FFF6B0, #C98400) border-box;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.55), inset 0 -4px 10px rgba(170,90,0,.35), 0 10px 22px rgba(110,15,0,.45);
}
.bf-btn--gold:hover { box-shadow: inset 0 2px 0 rgba(255,255,255,.6), inset 0 -4px 10px rgba(170,90,0,.35), 0 14px 28px rgba(110,15,0,.5), 0 0 26px rgba(255,215,0,.5); }
/* Botão B2B (agentes de viagem): mesmo formato, paleta azul do céu do hero (#0B7FE0). Secundário: um pouco
   menor que o "Cadastre-se agora" e sem o brilho animado, para não competir com o botão principal. */
.bf-btn--b2b {
  min-height: 56px; padding: 0 clamp(22px, 2.6vw, 36px); font-size: clamp(15px, 1.4vw, 19px);
  color: var(--bf-white); text-shadow: 0 2px 0 rgba(4, 40, 90, .45);
  background:
    radial-gradient(120% 140% at 50% 0%, #4FB0FF 0%, #0B7FE0 45%, #0762B8 100%) padding-box,
    linear-gradient(180deg, #BFE6FF 0%, #5DB6F5 40%, #0A5FAE 100%) border-box;
  box-shadow: inset 0 2px 0 rgba(255,255,255,.3), inset 0 -5px 12px rgba(0,40,100,.35), 0 12px 24px rgba(0,0,0,.45);
}
.bf-btn--b2b:hover { box-shadow: inset 0 2px 0 rgba(255,255,255,.34), inset 0 -5px 12px rgba(0,40,100,.35), 0 16px 30px rgba(0,0,0,.5), 0 0 28px rgba(11,127,224,.6); }
@keyframes bf-shine { 0%, 62% { transform: translateX(-160%) skewX(-18deg); } 100% { transform: translateX(520%) skewX(-18deg); } }

/* Dock: fica preso no rodapé da tela durante as seções 3 e 4 e "pousa" no fim delas */
.bf-dock {
  position: sticky; bottom: max(18px, env(safe-area-inset-bottom)); z-index: 40;
  display: flex; justify-content: center; align-items: center; gap: 16px; padding: 0 var(--bf-gutter);
  margin: clamp(28px, 6vh, 64px) 0 clamp(40px, 8vh, 96px); pointer-events: none;
}
.bf-dock .bf-btn { pointer-events: auto; }

/* =========================================================
   4. ATRIBUTOS (selos + card com mini-carrossel)
